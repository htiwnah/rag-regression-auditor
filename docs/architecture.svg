  <text x="786" y="122" fill="#1e293b" font-family="monospace" font-size="13">Exit 0=pass, 1=block, 2=err</text>
  <text x="786" y="148" fill="#1e293b" font-family="monospace" font-size="13">docs/metrics.json receipts</text>
  <text x="786" y="174" fill="#1e293b" font-family="monospace" font-size="13">Anchor-verified prose check</text>
